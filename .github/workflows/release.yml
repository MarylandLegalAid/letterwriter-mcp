# =============================================================================
# Publish a container image to GHCR when a version tag is pushed.
# =============================================================================
#     git tag v1.1.0 && git push origin v1.1.0
#
# The image tag is the git tag VERBATIM, `v` prefix included, because that is the
# form consumers pin. Nothing here publishes `latest` — deliberately. The
# deployment this feeds pins versions precisely because a `:latest` tag once let
# it drift silently onto a pre-release.
# =============================================================================

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'          # matches the Dockerfile's base image
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the publish on the tests. An image is immutable once pushed and
      # consumers pin it by tag, so a broken build is not something a later commit
      # quietly fixes — it needs a new version and a new tag.
      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag but package.json says $pkg"
            exit 1
          fi
          echo "Tag and package.json agree on $pkg."

      # No organization's letterhead may ever enter this repository. The .gitignore
      # blocks *.docx with one exception for the brand-free placeholder, but a
      # `git add -f` overrides .gitignore without comment, and a public repository
      # keeps whatever reaches its history. So it is also checked here, where the
      # check cannot be bypassed by the same mistake.
      - name: Check no letterhead files were committed
        run: |
          set -euo pipefail
          unexpected="$(git ls-files '*.docx' '*.doc' | grep -v '^templates/letterheads/generic.docx$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::documents other than the placeholder are committed:"
            echo "$unexpected"
            exit 1
          fi
          # The placeholder must stay a placeholder. Real letterhead artwork is
          # far larger than this, so size is a decent proxy for "somebody replaced
          # the sample with their own branding and committed it".
          size="$(stat -c%s templates/letterheads/generic.docx)"
          if [ "$size" -gt 51200 ]; then
            echo "::error::templates/letterheads/generic.docx is ${size} bytes; the placeholder is ~1.3 KB. Real letterhead artwork must not be committed."
            exit 1
          fi
          echo "Only the ${size}-byte placeholder is present."

      # A container repository name MUST be lowercase, and this GitHub
      # organization is spelled "MarylandLegalAid". Interpolating the owner
      # straight into the tag fails at the very last step, after everything else
      # has already succeeded.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 only: this runs on an Azure VM. Adding linux/arm64 is a
          # one-line change if you want it on an ARM Mac, at the cost of a slower
          # emulated build.
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          # image.source is what links the GHCR package to this repository in the
          # GitHub UI. Without it the package looks orphaned.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
